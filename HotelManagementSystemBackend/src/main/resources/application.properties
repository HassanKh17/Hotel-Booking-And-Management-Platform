spring.application.name=Hotel Management System Backend
spring.config.import=optional:file:.env.local[.properties]

server.servlet.context-path=/api/v1

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Datasource (In-memory)
spring.datasource.url=jdbc:h2:mem:test
spring.datasource.username=sa
spring.datasource.password=

# Hibernate auto schema creation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# CORS configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Card encryption
api.card.encryption.password=some-very-long-random-string
api.card.encryption.salt=deadbeef

# Booking confirmation email
booking.email.enabled=${BOOKING_EMAIL_ENABLED:true}
booking.email.transport=${BOOKING_EMAIL_TRANSPORT:smtp}
booking.email.from=${BOOKING_EMAIL_FROM:noreply@hotel-management.local}
elastic.email.api-key=${ELASTIC_EMAIL_API_KEY:}
elastic.email.api-url=${ELASTIC_EMAIL_API_URL:https://api.elasticemail.com/v4/emails/transactional}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:5000}
